name: Staging database migrations

# Applies the migrations in supabase/migrations that the staging database
# hasn't run yet (#631). A PR to staging gets a dry run that lists them.
# See wiki/database-migrations.md.
on:
  push:
    branches: ["staging"]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/staging-migrations.yml"
  pull_request:
    branches: ["staging"]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/staging-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a push halfway through. PR dry runs replace each other.
concurrency:
  group: staging-database-${{ github.event.pull_request.number || 'apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrate:
    name: Migrate staging
    runs-on: ubuntu-latest
    env:
      # Empty for PRs from forks and Dependabot, which get no secrets.
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      # --include-all also applies a migration older than the newest one
      # applied, as when two PRs merge in the opposite order they were written.
      - name: Apply pending migrations
        if: github.event_name != 'pull_request'
        run: supabase db push --db-url "$DATABASE_URL" --include-all --yes

      - name: List pending migrations (dry run)
        if: github.event_name == 'pull_request' && env.DATABASE_URL != ''
        run: supabase db push --db-url "$DATABASE_URL" --include-all --dry-run
