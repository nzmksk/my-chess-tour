name: Release notes

# The GitHub release notes are the changelog players and organizers read
# (#640). Each time a release is published or its notes are edited, check
# that they have something for users, or are marked silent. See
# wiki/releases.md for the format.
on:
  release:
    types: [published, edited]

jobs:
  check:
    name: Check the release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Releases are cut on staging. Checking out the release's own tag
          # would run an older release's edit against the code of its day.
          ref: staging

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Passed through the environment, never interpolated into the script.
      - name: Check the notes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: npx vitest run src/lib/__tests__/release-notes.release.test.ts
